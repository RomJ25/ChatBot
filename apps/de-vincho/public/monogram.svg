<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .frame { fill: none; stroke: currentColor; stroke-width: 1.4; opacity: 0.55; }
      .frame-inner { fill: none; stroke: currentColor; stroke-width: 0.8; opacity: 0.35; }
      .letter { fill: currentColor; font-family: "Cormorant Garamond", "EB Garamond", Georgia, serif; font-style: italic; font-weight: 600; }
    </style>
  </defs>
  <!-- thin oval frame -->
  <ellipse class="frame" cx="32" cy="32" rx="26" ry="22"/>
  <ellipse class="frame-inner" cx="32" cy="32" rx="23" ry="19"/>
  <!-- Center glyph: 'dV' in italic. Reads at any size. -->
  <text class="letter" x="32" y="42" text-anchor="middle" font-size="26">dV</text>
  <!-- Small dot to the left as a typographic ornament -->
  <circle cx="14" cy="32" r="0.9" fill="currentColor" opacity="0.8"/>
  <circle cx="50" cy="32" r="0.9" fill="currentColor" opacity="0.8"/>
</svg>
